name: pr-test
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - '3.13'
    steps:

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64

      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('REQUIREMENTS-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python requirements
        run: pip install -r REQUIREMENTS-dev.txt

      - name: Run flake8
        run: flake8 --config setup.cfg

  test:
    runs-on: ubuntu-latest
    needs:
      - lint
    defaults:
      run:
        working-directory: dockerize
    steps:
      - uses: actions/checkout@v7

      - name: Generate the .env file
        run: cp .env.template .env


      - name: Run docker-compose build
        run: docker compose build

      - name: Run the containers
        run: docker compose up -d db devweb


      - name: Wait for the containers to start
        run: sleep 30

      - name: Run test
        run: |
          docker compose exec -T devweb bash -c '
            set -e  # Exit immediately if any command fails
            python manage.py makemigrations &&
            python manage.py migrate &&
            python manage.py test
          '

      # Audits what the image actually resolved to, rather than what
      # REQUIREMENTS.txt asks for: the floors there are ranges, and most CVEs
      # land in transitive packages that are never named in that file.
      #
      # Report-only for now (|| true), matching the Grype posture in docker.yml.
      # Flip to a failing gate once the baseline is clean -- the sweep in this
      # branch took it from 54 findings to the residue left in unmaintained
      # dependencies.
      - name: Audit Python dependencies (pip-audit)
        if: always()
        run: |
          {
            echo '## pip-audit'
            echo
            echo '```'
            docker compose exec -T devweb bash -c \
              'pip install -q pip-audit && pip-audit --progress-spinner off' 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
